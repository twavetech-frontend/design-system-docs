name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [tokens-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tokens
        # design-system 레포는 private 이므로 read 권한이 있는 PAT 시크릿이 필요.
        # 시크릿(DESIGN_SYSTEM_TOKEN)이 없으면 기본 GITHUB_TOKEN 으로 시도 후
        # 실패 시 커밋된 토큰을 그대로 사용한다(스크립트가 덮어쓰지 않음).
        env:
          GH_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN || github.token }}
        run: npm run fetch-tokens

      - name: Build
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
